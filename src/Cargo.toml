[workspace]
members = [
    "crates/apiarray-core",
    "crates/apiarray-cli",
    "crates/apiarray-runtime",
    "apps/desktop/src-tauri",
    "crates/apiarray-windows-security",
]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
rust-version = "1.97"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9.42"
axum = "0.8"
bytes = "1"
dotenvy = "0.15.7"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "stream", "rustls"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
zeroize = { version = "1.9", features = ["std"] }
keyring = { version = "4.1.4", features = ["v1"] }
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
windows = { version = "0.61.3", features = ["Foundation", "Security_Credentials_UI", "Win32_Foundation", "Win32_System_WinRT"] }
windows-future = "0.2.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
